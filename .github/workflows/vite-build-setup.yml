name: Vite build setup

on:
  push:
    branches: [main]
    paths:
      - 'vite-build-setup/**'
      - '.github/workflows/vite-build-setup.yml'
  pull_request:
    paths:
      - 'vite-build-setup/**'
      - '.github/workflows/vite-build-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vite-build-setup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vite-build-setup/.nvmrc
          cache: npm
          cache-dependency-path: vite-build-setup/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check code, formatting and production build
        run: npm run check
      - name: Upload production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vite-build-setup-dist
          path: vite-build-setup/dist/
          if-no-files-found: error
          retention-days: 7
